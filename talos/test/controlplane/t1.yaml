---
# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.13/website/content/v1.13/schemas/config.schema.json
machine:
  install:
    disk: /dev/vda
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: t1
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - net0
bondMode: active-backup
miimon: 100
mtu: 1500
addresses:
  - address: 192.168.20.96/24
  - address: fdd5:aa8:9535:20::96/64
routes:
  - gateway: 192.168.20.1
  - gateway: fdd5:aa8:9535:20::1
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
  match: link.driver == "virtio_net" && mac(link.permanent_addr) == "52:54:00:a2:aa:1e"
