---
overlay:
  image: siderolabs/sbc-rockchip
  name: turingrk1
customization:
  extraKernelArgs:
    - -console
    - console=ttyS9,115200
    - console=tty1
    - -selinux # Less security, faster puter
    - selinux=0 # Less security, faster puter
  systemExtensions:
    officialExtensions:
      - siderolabs/iscsi-tools # Longhorn
      - siderolabs/util-linux-tools # Longhorn
