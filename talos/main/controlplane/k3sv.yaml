---
# yaml-language-server: $schema=https://raw.githubusercontent.com/siderolabs/talos/refs/heads/release-1.14/website/content/v1.14/schemas/config.schema.json
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/vda"
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  # special for this node, which is a qemu VM
  image: factory.talos.dev/metal-installer/6b112ffe277f7b5001f9f6b4c1a8947618ec552d0f8fe73a0ebe45710e4423de:v1.14.1
---
apiVersion: v1alpha1
kind: KubeNodeConfig
taints:
  node-role.kubernetes.io/control-plane: :NoSchedule
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: k3sv
---
apiVersion: v1alpha1
kind: BondConfig
name: bond0
links:
  - enp1s0
bondMode: active-backup
miimon: 100
mtu: 1500
addresses:
  - address: 192.168.20.20/24
  - address: fdd5:aa8:9535:20::20/64
routes:
  - gateway: 192.168.20.1
  - gateway: fdd5:aa8:9535:20::1
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
  # FIXME mac addr
  match: link.driver == "virtio_net"
