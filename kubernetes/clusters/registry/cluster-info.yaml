---
# yaml-language-server: $schema=https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.31/#configmap-v1-core
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-info
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  CLUSTER: registry
  SNAPSHOTCLASS: csi-local-hostpath
  # change to local-hostpath on next cluster rebuild
  STORAGECLASS: openebs-hostpath
  STORAGE_HR: openebs
  STORAGE_NS: storage
  SUBDOMAIN_SUFFIX: "-registry"
