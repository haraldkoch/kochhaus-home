---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: esphome
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/bootstrap
  dependsOn:
    - name: multus-networks
      namespace: network
    - name: longhorn
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/base/default/esphome
  postBuild:
    substitute:
      APP: esphome
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      KOPIUR_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
