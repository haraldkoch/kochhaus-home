---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: changedetection
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/kopiur/restore
  dependsOn:
    - name: longhorn
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/base/default/changedetection
  postBuild:
    substitute:
      APP: changedetection
      KOPIUR_PUID: "65532"
      KOPIUR_PGID: "65532"
      KOPIUR_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
