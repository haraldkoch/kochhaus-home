---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-addons
spec:
  interval: 1h
  path: ./kubernetes/apps/base/flux-system/addons
  postBuild:
    substitute:
      SUBDOMAIN: flux-webhook-${CLUSTER}
  prune: false # reset to true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
