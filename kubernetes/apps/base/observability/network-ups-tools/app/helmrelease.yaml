---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: network-ups-tools
spec:
  chartRef:
    kind: OCIRepository
    name: network-ups-tools
  interval: 1h
  values:
    controllers:
      network-ups-tools:
        # required for devic.es/cyberpower resource
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/jr0dd/network-ups-tools
              tag: v2.8.3@sha256:9f8e14d155c6ef05940cee6f8861e259e951eb11750aeddd02539d986dac1ca0
            env:
              TZ: "America/Toronto"
            securityContext:
              privileged: true
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 32Mi
                devic.es/cyberpower: 1
    defaultPodOptions:
      annotations:
        configmap.reloader.stakater.com/reload: network-ups-tools-config
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
    service:
      app:
        ports:
          http:
            port: 3493
            protocol: TCP
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        ipFamilies:
          - IPv4
          - IPv6
        ipFamilyPolicy: PreferDualStack
        annotations:
          external-dns.kubernetes.io/hostname: "network-ups-tools.${CLUSTER_DOMAIN}"
          lbipam.cilium.io/ips: ${SVC_EXPORTERS}
          lbipam.cilium.io/sharing-cross-namespace: default,observability
          lbipam.cilium.io/sharing-key: exporters
    persistence:
      config:
        type: configMap
        name: network-ups-tools
        defaultMode: 0400
        globalMounts:
          - path: /etc/nut
      ups:
        type: hostPath
        #hostPath: /dev/bus/usb/002/001
        hostPath: /dev/bus/usb/001/002
        globalMounts:
          - path: /dev/bus/usb/001/001
            readOnly: false
    configMaps:
      config:
        enabled: true
        data:
          nut.conf: |
            MODE=netserver
          upsd.conf: |
            MAXAGE 20
            LISTEN 0.0.0.0
            LISTEN ::
          ups.conf: |
            [kubernetes]
              driver = usbhid-ups
              port = auto
              desc = "Cyber Power System, Inc. PR1500LCDRT2U UPS"
              pollinterval = 10
  valuesFrom:
    - targetPath: configMaps.config.data.upsd\.users
      kind: Secret
      name: network-ups-tools-secret
      valuesKey: upsd.users
      literal: true
    - targetPath: configMaps.config.data.upsmon\.conf
      kind: Secret
      name: network-ups-tools-secret
      valuesKey: upsmon.conf
      literal: true
