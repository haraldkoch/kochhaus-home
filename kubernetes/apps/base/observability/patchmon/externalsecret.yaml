---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: patchmon
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: patchmon-secret
    template:
      data:
        # App
        AI_ENCRYPTION_KEY: "{{ .patchmon_ai_encryption_key }}"
        JWT_SECRET: "{{ .patchmon_jwt_secret }}"
        SESSION_SECRET: "{{ .patchmon_session_secret }}"
        OIDC_CLIENT_ID: "{{ .patchmon_oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .patchmon_oidc_client_secret }}"
        # Database
        DATABASE_URL: |-
          postgresql://{{ .patchmon_postgres_user }}:{{ .patchmon_postgres_password }}@postgres-rw.dbms.svc.cluster.local:5432/{{ .patchmon_postgres_db }}
        # Postgres Init
        INIT_POSTGRES_DBNAME: "{{ .patchmon_postgres_db }}"
        INIT_POSTGRES_HOST: "postgres-rw.dbms.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .patchmon_postgres_user }}"
        INIT_POSTGRES_PASS: "{{ .patchmon_postgres_password }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: patchmon
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "patchmon_$1"
