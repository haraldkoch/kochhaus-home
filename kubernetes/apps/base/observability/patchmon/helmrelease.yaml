---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: patchmon
spec:
  chartRef:
    kind: OCIRepository
    name: patchmon
  interval: 1h
  values:
    controllers:
      patchmon:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/haraldkoch/postgres-init
              tag: 18.6@sha256:3f1d734b05f605ef06a1a9ccda9c358658381f4cc825919e400521f943f9931b
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
        containers:
          app:
            image:
              repository: ghcr.io/patchmon/patchmon-server
              tag: 2.1.6@sha256:f27e1a059caf97331473de9e907d9592428b88857abb9f4b221cb80027b5a67f
            env:
              TZ: America/Toronto
              CORS_ORIGIN: https://patchmon.${CLUSTER_DOMAIN}
              PORT: &port 3000
              OIDC_ENABLED: true
              OIDC_DISABLE_LOCAL_AUTH: true
              OIDC_BUTTON_TEXT: Login with Authelia
              OIDC_AUTO_CREATE_USERS: true
              OIDC_ISSUER_URL: https://auth.${CLUSTER_DOMAIN}
              OIDC_REDIRECT_URI: https://patchmon.${CLUSTER_DOMAIN}/api/v1/auth/oidc/callback
              OIDC_SUPERADMIN_GROUP: admins
              OIDC_SYNC_ROLES: true
              REDIS_HOST: patchmon-dragonfly-db.observability.svc.cluster.local
              REDIS_PORT: 6379
              TRUST_PROXY: true
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1024Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${CLUSTER_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      tmpfs:
        type: emptyDir
        advancedMounts:
          patchmon:
            app:
              - path: /tmp
                subPath: tmp
