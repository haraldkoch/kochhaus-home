---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tplink-plug-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: tplink-plug-exporter
  interval: 1h
  values:
    controllers:
      tplink-plug-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/haraldkoch/tplink-plug-exporter
              tag: 0.9.0@sha256:156a05e3599eeaa423b9c258d398e95de60a8b54d5a212f7db106de1785cc7e6
            env:
              TZ: America/Toronto
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 100Mi
    service:
      app:
        ports:
          metrics:
            protocol: TCP
            port: 9233
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        ipFamilies:
          - IPv4
          - IPv6
        ipFamilyPolicy: PreferDualStack
        annotations:
          external-dns.kubernetes.io/hostname: ${SUBDOMAIN}.${CLUSTER_DOMAIN}
          lbipam.cilium.io/ips: ${SVC_EXPORTERS}
          lbipam.cilium.io/sharing-cross-namespace: default,observability
          lbipam.cilium.io/sharing-key: exporters
