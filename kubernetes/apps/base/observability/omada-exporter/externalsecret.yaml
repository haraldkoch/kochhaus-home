---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omada-exporter
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: omada-exporter-secret
    template:
      data:
        OMADA_USER: "{{ .omada_username }}"
        OMADA_PASS: "{{ .omada_password }}"
        OMADA_SITE: "{{ .omada_site }}"
  dataFrom:
    - extract:
        key: omada-exporter
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "omada_$1"
