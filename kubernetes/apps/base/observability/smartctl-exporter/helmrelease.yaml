---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app smartctl-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: smartctl-exporter
  interval: 1h
  values:
    fullnameOverride: *app
    image:
      repository: ghcr.io/haraldkoch/smartctl_exporter
      tag: 0.15.0@sha256:e9aff885312dc3a437625f5bdb18c9127f1ba7cd7c965e622a86f8ca12a0caba
    config:
      devices:
        - /dev/sda
        - /dev/nvme0n1
    # we also monitor from heimdall
    hostNetwork: true
    serviceMonitor:
      enabled: true
      relabelings:
        - action: labeldrop
          regex: (pod)
    prometheusRules:
      enabled: false
