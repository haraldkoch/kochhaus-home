---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name kopiur-repository
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-repository-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .kopiur_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .kopiur_secret_access_key }}"
        KOPIA_PASSWORD: "{{ .kopiur_kopia_password }}"
  dataFrom:
    - extract:
        key: kopiur
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "kopiur_$1"
