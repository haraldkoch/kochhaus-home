---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  chartRef:
    kind: OCIRepository
    name: csi-driver-nfs
  interval: 1h
  values:
    controller:
      runOnControlPlane: true
    externalSnapshotter:
      enabled: false
    feature:
      # this removes fsGroupPolicy: File from the CSIDriver, which makes
      # mounting faster (even with fsGroupChangePolicy: OnRootMismatch)
      enableFSGroupPolicy: false
    node:
      tolerations:
        - key: kochhaus.home.arpa/silo
          operator: Exists
          effect: NoSchedule
    storageClass:
      create: true
      name: nfs-direct
      parameters:
        server: jezebel.${PRIVATE_STATIC_DOMAIN}
        share: /k8s/nfs-${CLUSTER}
      mountOptions:
        - nfsvers=4.2
        - nconnect=16
        - hard
        - noatime
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
