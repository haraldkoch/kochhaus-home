---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openweathermap-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: openweathermap-exporter
  interval: 1h
  valuesFrom:
    - targetPath: controllers.openweathermap-exporter.containers.app.env.OWM_API_KEY
      kind: Secret
      name: openweathermap-secret
      valuesKey: openweathermap_api_key
  values:
    controllers:
      openweathermap-exporter:
        containers:
          app:
            image:
              repository: ghcr.io/haraldkoch/openweathermap-exporter
              tag: 0.6.1@sha256:1f1d5a6040ab3f886e986b920fb88ca6d679c6228ec20b8517758e619ca8787e
            env:
              TZ: America/Toronto
              SERVER_PORT: "2112"
              OWM_LOCATION: Toronto,CA
              # replaced by valuesFrom
              # OWM_API_KEY: ${OPENWEATHERMAP_API_KEY}
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 15m
                memory: 32Mi
              limits:
                memory: 96Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    defaultPodOptions:
      securityContext:
        runAsUser: 1022
        runAsGroup: 1022
        runAsNonRoot: true
    service:
      app:
        ports:
          metrics:
            protocol: HTTP
            port: 2112
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        ipFamilies:
          - IPv4
          - IPv6
        ipFamilyPolicy: PreferDualStack
        annotations:
          external-dns.kubernetes.io/hostname: "exporters.${CLUSTER_DOMAIN}"
          lbipam.cilium.io/ips: ${SVC_EXPORTERS}
          lbipam.cilium.io/sharing-cross-namespace: default,observability
          lbipam.cilium.io/sharing-key: exporters
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
            metricRelabelings:
              - action: labeldrop
                regex: (pod)
              - action: replace
                sourceLabels:
                  - "service"
                targetLabel: instance
