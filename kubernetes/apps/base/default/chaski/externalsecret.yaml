---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chaski
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: chaski-secret
    template:
      data:
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        RADARR_PUSHOVER_TOKEN: "{{ .RADARR_PUSHOVER_TOKEN }}"
        SONARR_PUSHOVER_TOKEN: "{{ .SONARR_PUSHOVER_TOKEN }}"
  dataFrom:
    - extract:
        key: radarr
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
        # - regexp:
        #     source: "(.*)"
        #     target: "radarr_$1"
    - extract:
        key: sonarr
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
        # - regexp:
        #     source: "(.*)"
        #     target: "sonarr_$1"
    - extract:
        key: pushover
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
        # - regexp:
        #     source: "(.*)"
        #     target: "pushover_$1"
