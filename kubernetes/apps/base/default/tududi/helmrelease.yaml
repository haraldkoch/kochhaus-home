---
# yaml-language-server: $schema=https://k8s-versioned-schemas.pages.dev/flux/2.9.5/helmrelease_v2.json?values=app-template/5.2.1
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tududi
spec:
  chartRef:
    kind: OCIRepository
    name: tududi
  interval: 1h
  values:
    controllers:
      tududi:
        initContainers:
          init-db:
            image:
              repository: ghcr.io/haraldkoch/postgres-init
              tag: 18.6@sha256:3f1d734b05f605ef06a1a9ccda9c358658381f4cc825919e400521f943f9931b
            envFrom:
              - secretRef:
                  name: tududi-secret
        containers:
          tududi:
            image:
              repository: ghcr.io/home-operations/tududi
              tag: 1.7.1@sha256:ce25069d3e9b5524d797307eadf7493dc50df1c1ed82f412fc153cf74316e515
            # docker-entrypoint.sh only exists to chown /app and su-exec down; it
            # needs root, so skip straight to the start script it would exec.
            command:
              - "/app/backend/cmd/start.sh"
            env:
              BASE_URL: &url https://todo.${CLUSTER_DOMAIN}
              TUDUDI_ALLOWED_ORIGINS: *url
              TUDUDI_TRUST_PROXY: 1
              COOKIE_SECURE: true
              FF_ENABLE_BACKUPS: false
              # start.sh shells out to npx for migrations; npm wants a writable HOME.
              HOME: /tmp
              DATABASE_URL:
                secretKeyRef:
                  name: tududi-secret
                  key: DATABASE_URL
              DISABLE_TELEGRAM: true
              PASSWORD_AUTH_ENABLED: "false"
              OIDC_ENABLED: "true"
              OIDC_PROVIDER_NAME: Authelia
              OIDC_PROVIDER_SLUG: authelia
              OIDC_SCOPE: openid profile email
              OIDC_AUTO_PROVISION: "true"
              OIDC_ISSUER_URL: https://auth.${CLUSTER_DOMAIN}
              OIDC_CLIENT_ID:
                secretKeyRef:
                  name: tududi-secret
                  key: OIDC_CLIENT_ID
              OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: tududi-secret
                  key: OIDC_CLIENT_SECRET
              TUDUDI_SESSION_SECRET:
                secretKeyRef:
                  name: tududi-secret
                  key: TUDUDI_SESSION_SECRET
            probes:
              # /api/health is liveness only; /api/health/ready also checks the db
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: &port 3002
                    path: /api/health
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: &ready /api/health/ready
              # start.sh runs migrations before app.js binds the port
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: *port
                    path: *ready
                  periodSeconds: 5
                  failureThreshold: 36
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      tududi:
        controller: tududi
        ports:
          http:
            port: *port
    route:
      tududi:
        hostnames:
          - todo.${CLUSTER_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      # Attachments and avatars
      uploads:
        existingClaim: tududi
        globalMounts:
          - path: /app/uploads
            subPath: uploads
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
