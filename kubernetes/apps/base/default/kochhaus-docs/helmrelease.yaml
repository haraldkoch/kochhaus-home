---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kochhaus-docs
spec:
  chartRef:
    kind: OCIRepository
    name: kochhaus-docs
  interval: 1h
  values:
    controllers:
      kochhaus-docs:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          kochhaus-docs:
            image:
              repository: harbor.${CLUSTER_DOMAIN}/kochhaus/kochhaus-docs
              tag: main
              pullPolicy: Always
            env:
              TZ: America/Toronto
              SERVER_PORT: 80
              SERVER_LOG_LEVEL: info
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    defaultPodOptions:
      securityContext:
        runAsUser: 65533
        runAsGroup: 65533
        fsGroup: 65533
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        hostnames:
          - "docs.${CLUSTER_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: kochhaus-docs
                port: 80
            matches:
              - path:
                  type: PathPrefix
                  value: /
