---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: silo
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: silo-secret
    template:
      data:
        DATABASE_URL: "postgres://{{ .silo_postgres_user }}:{{ .silo_postgres_pass }}@postgres-rw.dbms/silo?sslmode=disable"
        SECRET_KEY: "{{ .silo_secret_key }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: silo
        INIT_POSTGRES_HOST: postgres-rw.dbms.svc.cluster.local.
        INIT_POSTGRES_USER: "{{ .silo_postgres_user }}"
        INIT_POSTGRES_PASS: "{{ .silo_postgres_pass }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: silo
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "silo_$1"
    - extract:
        key: cloudnative-pg
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
