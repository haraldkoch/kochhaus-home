---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app homelable
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: homelable-secret
    template:
      data:
        SECRET_KEY: "{{ .homelable_secret_key }}"
        AUTH_USERNAME: "{{ .homelable_auth_username }}"
        AUTH_PASSWORD_HASH: "{{ .homelable_auth_password_hash }}"
        # OIDC (optional — remove if using local auth only)
        # OIDC_CLIENT_SECRET: "{{ .homelable_oidc_client_secret }}"
  dataFrom:
    - extract:
        key: homelable
      rewrite:
        - regexp:
            source: "[^a-zA-Z0-9 -]"
            target: "_"
        - regexp:
            source: "(.*)"
            target: "homelable_$1"
