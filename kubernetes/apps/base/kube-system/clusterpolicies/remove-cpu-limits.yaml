---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone-strict/mutatingadmissionpolicy-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: remove-cpu-limit
  annotations:
    policies.kyverno.io/title: Remove CPU limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      This policy removes CPU limits from all Pods.
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kyverno
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: not-ignored
      expression: object.metadata.?annotations['policy.home.arpa/ignore'].orValue('') != 'true'
    - name: has-cpu-limit
      expression: >-
        object.spec.?containers.orValue([]).exists(c,
          has(c.resources) && has(c.resources.limits) && 'cpu' in c.resources.limits) ||
        object.spec.?initContainers.orValue([]).exists(c,
          has(c.resources) && has(c.resources.limits) && 'cpu' in c.resources.limits)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          object.spec.containers.filter(c, has(c.resources) && has(c.resources.limits) &&
            has(c.resources.limits.cpu)).map(c, JSONPatch{
              op: "remove",
              path: "/spec/containers/" + string(object.spec.containers.indexOf(c)) + "/resources/limits/cpu"
          })
    - patchType: JSONPatch
      jsonPatch:
        expression: |
          has (object.spec.initContainers) ?
            object.spec.initContainers.filter(c, has(c.resources) &&
              has(c.resources.limits) && has(c.resources.limits.cpu)).map(c, JSONPatch{
                op: "remove",
                path: "/spec/initContainers/" + string(object.spec.initContainers.indexOf(c)) + "/resources/limits/cpu"
            })
          : []
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone-strict/mutatingadmissionpolicybinding-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: remove-cpu-limit
spec:
  policyName: remove-cpu-limit
