---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone-strict/mutatingadmissionpolicy-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: inject-timezone
spec:
  failurePolicy: Fail
  reinvocationPolicy: Never
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: not-ignored
      expression: object.metadata.?annotations['policy.home.arpa/ignore'].orValue('') != 'true'
    # JSON patches append, so skip pods that already have the timezone volume.
    - name: not-already-injected
      expression: >-
        !object.spec.?volumes.orValue([]).exists(v, v.name == 'timezone')
  variables:
    - name: initContainer
      expression: >-
        Object.spec.initContainers{
          name: "provide-timezone",
          image: "quay.io/k8tz/k8tz:0.22.0",
          imagePullPolicy: "IfNotPresent",
          args: ["bootstrap"],
          resources: Object.spec.initContainers.resources{
            requests: {"cpu": "10m", "memory": "100Mi"}
          },
          volumeMounts: [
            Object.spec.initContainers.volumeMounts{
              mountPath: "/mnt/zoneinfo",
              name: "timezone"
            }
          ]
        }
    - name: volume
      expression: >-
        Object.spec.volumes{
          name: "timezone",
          emptyDir: Object.spec.volumes.emptyDir{}
        }
    - name: volumeMounts
      expression: >-
        [
          Object.spec.containers.volumeMounts{
            mountPath: "/etc/localtime",
            name: "timezone",
            readOnly: true,
            subPath: "${TIMEZONE}"
          },
          Object.spec.containers.volumeMounts{
            mountPath: "/usr/share/zoneinfo",
            name: "timezone",
            readOnly: true
          }
        ]
    - name: env
      expression: >-
        [Object.spec.containers.env{name: "TZ", value: "${TIMEZONE}"}]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        # A missing list is created empty first, then every item is appended with "/-".
        expression: >-
          (has(object.spec.initContainers) ? [] :
            [JSONPatch{op: "add", path: "/spec/initContainers", value: []}]) +
          [JSONPatch{op: "add", path: "/spec/initContainers/-", value: variables.initContainer}] +
          (has(object.spec.volumes) ? [] :
            [JSONPatch{op: "add", path: "/spec/volumes", value: []}]) +
          [JSONPatch{op: "add", path: "/spec/volumes/-", value: variables.volume}] +
          lists.range(size(object.spec.containers)).map(i,
            (has(object.spec.containers[i].volumeMounts) ? [] :
              [JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/volumeMounts", value: []}]) +
            variables.volumeMounts.map(m,
              JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/volumeMounts/-", value: m}) +
            (has(object.spec.containers[i].env) ? [] :
              [JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/env", value: []}]) +
            variables.env.map(e,
              JSONPatch{op: "add", path: "/spec/containers/" + string(i) + "/env/-", value: e})
          ).flatten()
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone-strict/mutatingadmissionpolicybinding-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: inject-timezone
spec:
  policyName: inject-timezone
