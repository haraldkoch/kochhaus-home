---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone-strict/mutatingadmissionpolicy-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: add-safe-to-evict
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: not-ignored
      expression: object.metadata.?annotations['policy.home.arpa/ignore'].orValue('') != 'true'
    - name: has-local-volume
      expression: object.spec.?volumes.orValue([]).exists(v, has(v.emptyDir) || has(v.hostPath))
    - name: annotation-absent
      expression: >-
        !object.metadata.?annotations['cluster-autoscaler.kubernetes.io/safe-to-evict'].hasValue()
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            metadata: Object.metadata{
              annotations: {"cluster-autoscaler.kubernetes.io/safe-to-evict": "true"}
            }
          }
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/refs/heads/master/master-standalone-strict/mutatingadmissionpolicybinding-admissionregistration-v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: add-safe-to-evict
spec:
  policyName: add-safe-to-evict
