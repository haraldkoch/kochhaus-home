---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  chartRef:
    kind: OCIRepository
    name: llmkube
  interval: 1h
  values:
    modelCache:
      enabled: true
      mode: shared
      accessMode: ReadWriteMany
      storageClass: nfs-direct
      size: 300Gi
    prometheus:
      inferencePodMonitor:
        enabled: true
