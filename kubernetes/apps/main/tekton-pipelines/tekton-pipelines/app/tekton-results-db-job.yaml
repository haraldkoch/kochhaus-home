---
apiVersion: batch/v1
kind: Job
metadata:
  name: tekton-results-db-job
spec:
  backoffLimit: 4
  template:
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: tekton-results-postgres
          image: ghcr.io/haraldkoch/postgres-init:18.7@sha256:d243a98801a3cd2077bc6d9fb23654ffe3d705663c43756d3d57328bfa26219c
          name: init-db
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
      restartPolicy: OnFailure
