---
apiVersion: batch/v1
kind: Job
metadata:
  name: tekton-results-db-job
spec:
  backoffLimit: 4
  template:
    spec:
      containers:
        - envFrom:
            - secretRef:
                name: tekton-results-postgres
          image: ghcr.io/haraldkoch/postgres-init:19.0@sha256:878738061d611e6d4dddd1abc7c229a2adfeec1601cb9d590b34bcb286b02c67
          name: init-db
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
      restartPolicy: OnFailure
