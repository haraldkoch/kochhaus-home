---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  path: ./kubernetes/apps/base/network/envoy-gateway/app
  postBuild:
    substitute:
      REPLICAS: "2"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-config
spec:
  dependsOn:
    - name: certificates-import
    - name: envoy-gateway
  interval: 1h
  path: ./kubernetes/apps/base/network/envoy-gateway/config
  postBuild:
    substitute:
      EXTERNAL_DOMAIN: external-${CLUSTER}
      # FIXME - internal-main
      INTERNAL_DOMAIN: internal
      REPLICAS: "2"
      SVC_GATEWAY_EXTERNAL: 192.168.21.81,fdd5:aa8:9535:21::81
      SVC_GATEWAY_INTERNAL: 192.168.21.80,fdd5:aa8:9535:21::80
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
