---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linode-backup
spec:
  chartRef:
    kind: OCIRepository
    name: linode-backup
  interval: 1h
  values:
    controllers:
      main:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "15 * * * *"
          failedJobsHistory: 2
        pod:
          labels:
            setGateway: "false"
            network: linode
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 1000
        containers:
          main:
            image:
              repository: ghcr.io/haraldkoch/rsync
              tag: 3.5.2@sha256:fd0571493894f1a24787a3ef3b34fd4a1cb2a05629eccc19ec762d6be0f23981
            env:
              TZ: America/Toronto
            command:
              - /bin/sh
              - -c
              - |-
                printf "\e[1;32m%-6s\e[m\n" "Running rsync ..."
                /usr/bin/rsync -avSAHX --numeric-ids -e "/usr/bin/ssh -i /ssh/id_rsa -o GlobalKnownHostsFile=/ssh/known_hosts" backup@phaedra.cfrq.net:/data/website-backups/ /backup/
                printf "\e[1;32m%-6s\e[m\n" "rsync complete."
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                memory: 128Mi
                cpu: 15m
              limits:
                memory: 512Mi
    persistence:
      backup:
        type: nfs
        server: mnemosyne.home.arpa
        path: /backup/data/k8s/website-backups
      ssh:
        type: secret
        name: ssh-config
        globalMounts:
          - path: ssh
          - path: /etc/passwd
            subPath: passwd
            readOnly: true
