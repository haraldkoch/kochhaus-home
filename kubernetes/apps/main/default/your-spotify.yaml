---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: your-spotify
spec:
  components:
    - ../../../../components/gatus/external
    - ../../../../components/main/volsync
  dependsOn:
    - name: volsync
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/base/default/your-spotify
  postBuild:
    substitute:
      APP: your-spotify
      GATUS_SUBDOMAIN: spotty
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_CLAIM: your-spotify-config-v6
      VOLSYNC_GID: "1000"
      VOLSYNC_UID: "1000"
  prune: false # reset to true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
