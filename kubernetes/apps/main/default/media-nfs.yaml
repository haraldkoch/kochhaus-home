---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-nfs
spec:
  accessModes:
    - ReadWriteMany
  capacity:
    storage: 17Ti
  csi:
    driver: nfs.csi.k8s.io
    # volumeHandle must be unique: server#share#subdir
    volumeHandle: "mnemosyne.home.arpa#media#"
    volumeAttributes:
      server: mnemosyne.home.arpa
      share: /media
  mountOptions:
    - nfsvers=4.2
    - nconnect=8
    - hard
  persistentVolumeReclaimPolicy: Retain
  storageClassName: media-nfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-nfs
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 17Ti
  storageClassName: media-nfs
