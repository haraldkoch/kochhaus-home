---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: picoshare
spec:
  components:
    - ../../../../components/anubis
    - ../../../../components/main/volsync
  dependsOn:
    - name: volsync
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/base/default/picoshare
  postBuild:
    substitute:
      ANUBIS_TARGET: http://picoshare.default.svc.cluster.local:4001
      APP: picoshare
      GATUS_SUBDOMAIN: share
      VOLSYNC_CAPACITY: 25Gi
      VOLSYNC_CLAIM: picoshare-data-v1
      VOLSYNC_GID: "1000"
      VOLSYNC_UID: "1000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
