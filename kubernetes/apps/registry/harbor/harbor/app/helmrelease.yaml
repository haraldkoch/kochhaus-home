---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  chart:
    spec:
      chart: harbor
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: harbor
  interval: 1h
  valuesFrom:
    - targetPath: database.internal.password
      kind: Secret
      name: harbor-secret
      valuesKey: harbor_postgres_password
    - targetPath: harborAdminPassword
      kind: Secret
      name: harbor-secret
      valuesKey: harbor_admin_password
    - targetPath: secretKey
      kind: Secret
      name: harbor-secret
      valuesKey: harbor_encryption_key
    - targetPath: persistence.imageChartStorage.s3.accesskey
      kind: Secret
      name: harbor-secret
      valuesKey: harbor_aws_access_key_id
    - targetPath: persistence.imageChartStorage.s3.secretkey
      kind: Secret
      name: harbor-secret
      valuesKey: harbor_aws_secret_access_key
  values:
    expose:
      type: loadBalancer
      tls:
        certSource: secret
        secret:
          secretName: tls.harbor
      loadBalancer:
        name: harbor
        annotations:
          external-dns.kubernetes.io/hostname: "harbor.${CLUSTER_DOMAIN}"
          lbipam.cilium.io/ips: "192.168.23.90,fdd5:aa8:9535:23::90"
    externalURL: https://harbor.${CLUSTER_DOMAIN}
    ipFamily:
      ipv6:
        enabled: false
    persistence:
      enabled: true
      persistentVolumeClaim:
        jobservice:
          jobLog:
            storageClass: ${STORAGECLASS}
        database:
          storageClass: ${STORAGECLASS}
        redis:
          storageClass: ${STORAGECLASS}
        trivy:
          storageClass: ${STORAGECLASS}
          size: 10Gi
      imageChartStorage:
        type: s3
        s3:
          bucket: harbor
          # replaced by valuesFrom
          # accesskey: ${AWS_SECRET_KEY_ID}
          # secretkey: ${AWS_SECRET_KEY}
          region: garage
          regionendpoint: http://mnemosyne.home.arpa:3900
          rootdirectory: /prod

    database:
      type: internal

    # replaced by valuesFrom
    # harborAdminPassword: "${SECRET_HARBOR_ADMIN_PASSWORD}"
    # The secret key used for encryption. Must be a string of 16 chars.
    # secretKey: "${SECRET_HARBOR_ENCRPYTION_KEY}"

    notary:
      enabled: false

    nginx:
      podAnnotations:
        secret.reloader.stakater.com/reload: tls.harbor
