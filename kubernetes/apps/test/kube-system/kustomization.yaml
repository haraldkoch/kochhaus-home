---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

components:
  - ../../../components/namespace

replacements:
  - path: ../../../components/replacements/ks.yaml

resources:
  # cluster policies are loaded here
  - ../../../apps/base/kube-system/clusterpolicies/add-safe-to-evict.yaml
  - ../../../apps/base/kube-system/clusterpolicies/deny-ingress.yaml
  - ../../../apps/base/kube-system/clusterpolicies/remove-cpu-limits.yaml
  # applications
  - ./cilium.yaml
  - ./coredns.yaml
  - ./metrics-server.yaml
  - ./reloader.yaml
