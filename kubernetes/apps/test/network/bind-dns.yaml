---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bind-dns
spec:
  interval: 1h
  path: ./kubernetes/apps/base/network/bind-dns
  prune: true
  postBuild:
    substitute:
      PRIVATE_DNS_PRIMARY: 192.168.10.6
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
