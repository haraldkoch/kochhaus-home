---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  path: ./kubernetes/apps/base/network/envoy-gateway/app
  targetNamespace: network
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-config
spec:
  dependsOn:
    - name: certificates-import
    - name: envoy-gateway
  interval: 1h
  path: ./kubernetes/apps/test/network/envoy-gateway
  postBuild:
    substitute:
      REPLICAS: "1"
      EXTERNAL_DOMAIN: external-${CLUSTER}
      INTERNAL_DOMAIN: internal-${CLUSTER}
      SVC_GATEWAY_EXTERNAL: 192.168.19.81
      SVC_GATEWAY_INTERNAL: 192.168.19.80
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
