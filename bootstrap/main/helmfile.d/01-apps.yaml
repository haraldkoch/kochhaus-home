---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Bootstraps core applications that provide a minimal runtime base for the
# cluster. These releases are installed first so the cluster has the resources
# Flux needs before its own reconciliation begins.
#
# After this bootstrap phase, Flux is ready to take over management of the
# application stack and continue reconciling downstream state.

helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

bases:
  - default.yaml

defaultInherit: default

releases:
  - name: cilium
    namespace: kube-system
    hooks:
      - # Wait for Cilium CRDs to be available
        command: bash
        args:
          - -c
          - until kubectl --context={{ requiredEnv "CLUSTER" }} get crd ciliumloadbalancerippools.cilium.io ciliuml2announcementpolicies.cilium.io ciliumbgpadvertisements.cilium.io ciliumbgppeerconfigs.cilium.io ciliumbgpclusterconfigs.cilium.io &>/dev/null; do sleep 5; done
        events:
          - postsync
        showlogs: true
      - # Apply Resources
        command: kubectl
        args:
          - apply
          - --context={{ requiredEnv "CLUSTER" }}
          - --namespace={{ .Release.Namespace }}
          - --server-side
          - --force-conflicts
          - --filename=../../../kubernetes/apps/{{ requiredEnv "CLUSTER" }}/{{ .Release.Namespace }}/{{ .Release.Name }}/networking.yaml
        events:
          - postsync
        showlogs: true

  - name: coredns
    namespace: kube-system
    needs:
      - kube-system/cilium

  - name: cert-manager
    namespace: cert-manager
    needs:
      - kube-system/coredns

  - name: external-secrets
    namespace: security
    needs:
      - cert-manager/cert-manager

  - name: onepassword
    namespace: security
    hooks:
      - # Wait for ExternalSecrets CRDs to be available
        command: bash
        args:
          - -c
          - until kubectl --context={{ requiredEnv "CLUSTER" }} get crd clustersecretstores.external-secrets.io &>/dev/null; do sleep 5; done
        events:
          - postsync
        showlogs: true
      - # Apply Resources
        command: kubectl
        args:
          - apply
          - --context={{ requiredEnv "CLUSTER" }}
          - --server-side
          - --force-conflicts
          - --filename=../../../kubernetes/apps/base/{{ .Release.Namespace }}/{{ .Release.Name }}/clustersecretstore.yaml
        events:
          - postsync
        showlogs: true
    needs:
      - security/external-secrets

  - name: flux-operator
    namespace: flux-system
    needs:
      - security/onepassword

  - name: flux-instance
    namespace: flux-system
    needs:
      - flux-system/flux-operator
