---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:

  talos:
    desc: Bootstrap Talos [CLUSTER=required]
    summary: |
      Args:
        CLUSTER: Cluster to run command against (required)
    cmds:
      - bash {{.SCRIPTS_DIR}}/bootstrap-talos.sh {{.CLUSTER}}
      - kubectl config set-cluster {{.CLUSTER}} --server https://{{.RANDOM_CONTROLLER}}:6443
    requires:
      vars:
        - CLUSTER
    preconditions:
      - find --version | grep -q GNU
      - test -f {{.SCRIPTS_DIR}}/bootstrap-talos.sh
      - which gum op talosctl yq
    vars:
      RANDOM_CONTROLLER:
        sh: talosctl --talosconfig {{.TALOS_DIR}}/talosconfig config info --output yaml | yq --exit-status '.endpoints[0]'

  apps:
    desc: Bootstrap Kubernetes Apps [CLUSTER=required]
    summary: |
      Args:
        CLUSTER: Cluster to run command against (required)
    # FIXME: per-cluster script?
    cmds:
      - kubectl config set-cluster {{.CLUSTER}} --server https://{{.RANDOM_CONTROLLER}}:6443
      - bash {{.SCRIPTS_DIR}}/bootstrap-apps.sh {{.CLUSTER}}
    env:
      CLUSTER: "{{.CLUSTER}}"
      CLUSTER_APPS: "{{.CLUSTER_APPS}}"
      CLUSTER_DIR: "{{.CLUSTER_DIR}}"
    preconditions:
      - msg: Unsupported bash version, run `brew install bash` to upgrade
        sh: '{{if eq OS "darwin"}}test -f /opt/homebrew/bin/bash || test -f /usr/local/bin/bash{{end}}'
      - test -f {{.KUBERNETES_DIR}}/{{.CLUSTER}}/kubeconfig
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SCRIPTS_DIR}}/bootstrap-apps.sh
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which gum helm helmfile kubectl
    requires:
      vars:
        - "CLUSTER"
    vars:
      RANDOM_CONTROLLER:
        sh: talosctl --talosconfig {{.TALOS_DIR}}/talosconfig config info --output yaml | yq --exit-status '.endpoints[0]'
